name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.2.0-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install git/python3 (container is minimal)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3

      - name: Include-closure gate
        run: python3 tools/self_containment.py

      - name: Resolve pinned base SHAs
        run: |
          set -euo pipefail
          REPO=https://github.com/deepseek-ai/DeepGEMM.git
          # nv_dev-lineage base: pin to the commit recorded at extraction time.
          NV_SHA="$(git ls-remote "$REPO" | grep -i '^572557e' | head -1 | cut -f1)"
          if [ -z "$NV_SHA" ]; then
            echo "error: 572557e no longer resolves on $REPO; update the pin" >&2
            exit 1
          fi
          # main-lineage base: pin to the current main tip.
          MAIN_SHA="$(git ls-remote "$REPO" refs/heads/main | cut -f1)"
          echo "nv_dev base:  $NV_SHA"
          echo "main base:    $MAIN_SHA"
          echo "NV_SHA=$NV_SHA" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"

      - name: Clone bases (cutlass submodule only)
        run: |
          set -euo pipefail
          clone_base() {
            local url="$1" sha="$2" dst="$3"
            mkdir -p "$dst" && cd "$dst"
            git init -q
            git remote add origin "$url"
            git fetch --depth 1 origin "$sha" || git fetch origin
            git checkout -q FETCH_HEAD
            git submodule update --init --depth 1 third-party/cutlass || \
              git submodule update --init third-party/cutlass
            cd - > /dev/null
          }
          clone_base https://github.com/deepseek-ai/DeepGEMM.git "$NV_SHA"   "$RUNNER_TEMP/base-nv-dev"
          clone_base https://github.com/deepseek-ai/DeepGEMM.git "$MAIN_SHA" "$RUNNER_TEMP/base-main"

      - name: Compile gate vs nv_dev-lineage base
        run: |
          ./tools/compile_gate.sh \
            "$RUNNER_TEMP/base-nv-dev/deep_gemm/include" \
            "$RUNNER_TEMP/base-nv-dev/third-party/cutlass/include"

      - name: Compile gate vs main-lineage base
        run: |
          ./tools/compile_gate.sh \
            "$RUNNER_TEMP/base-main/deep_gemm/include" \
            "$RUNNER_TEMP/base-main/third-party/cutlass/include"

      - name: Vendor manifest check against a synthetic fork staging
        run: |
          set -euo pipefail
          # Simulate a fork: base checkout with the vendored tree copied over it.
          STAGING="$RUNNER_TEMP/staging-fork"
          cp -r "$RUNNER_TEMP/base-nv-dev" "$STAGING"
          cp -r deep_gemm "$STAGING/"
          cp VENDOR-sm120.json "$STAGING/"
          python3 tools/check_vendor.py "$STAGING"
