name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.2.0-devel-ubuntu24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install git/python3 (container is minimal)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3

      - name: Include-closure gate
        run: python3 tools/self_containment.py

      - name: Resolve pinned base SHAs
        run: |
          set -euo pipefail
          # The SM120 layer targets the post-"Public Release 26/09" (main #432) API
          # surface. The two deployment lineages are deepseek main and vllm dev;
          # pristine nv_dev predates that API and is not a compile target (the
          # nv_dev-lineage vehicle is deepseek-ai/DeepGEMM#447, covered by its own
          # GPU test suite).
          MAIN_SHA="$(git ls-remote https://github.com/deepseek-ai/DeepGEMM.git refs/heads/main | cut -f1)"
          VLLM_SHA="$(git ls-remote https://github.com/vllm-project/DeepGEMM.git refs/heads/dev | cut -f1)"
          echo "main base:    $MAIN_SHA"
          echo "vllm dev base: $VLLM_SHA"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "VLLM_SHA=$VLLM_SHA" >> "$GITHUB_ENV"

      - name: Clone bases (cutlass submodule only)
        run: |
          set -euo pipefail
          clone_base() {
            local url="$1" sha="$2" dst="$3"
            mkdir -p "$dst" && cd "$dst"
            git init -q
            git remote add origin "$url"
            git fetch --depth 1 origin "$sha" || git fetch origin
            git checkout -q FETCH_HEAD
            git submodule update --init --depth 1 third-party/cutlass || \
              git submodule update --init third-party/cutlass
            cd - > /dev/null
          }
          clone_base https://github.com/deepseek-ai/DeepGEMM.git "$MAIN_SHA" "$RUNNER_TEMP/base-main"
          clone_base https://github.com/vllm-project/DeepGEMM.git "$VLLM_SHA" "$RUNNER_TEMP/base-vllm-dev"

      - name: Compile gate vs vllm-dev-lineage base
        run: |
          ./tools/compile_gate.sh \
            "$RUNNER_TEMP/base-vllm-dev/deep_gemm/include" \
            "$RUNNER_TEMP/base-vllm-dev/third-party/cutlass/include"

      - name: Compile gate vs main-lineage base
        run: |
          ./tools/compile_gate.sh \
            "$RUNNER_TEMP/base-main/deep_gemm/include" \
            "$RUNNER_TEMP/base-main/third-party/cutlass/include"

      - name: Vendor drift check against a synthetic fork staging
        run: |
          set -euo pipefail
          # Simulate a fork: base checkout with the vendored tree copied over it.
          STAGING="$RUNNER_TEMP/staging-fork"
          cp -r "$RUNNER_TEMP/base-main" "$STAGING"
          cp -r deep_gemm "$STAGING/"
          python3 tools/check_vendor.py --fork "$STAGING"
